name: CI & Auto Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run Core Tests & Race Detector
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Benchmarks
        run: |
          go test -bench=".*" -benchmem -run=^$ ./...

      - name: Run Smoke Fuzzing
        run: |
          go test -fuzz=FuzzFrameDecoder -fuzztime=3s
          go test -fuzz=FuzzHandshakeParser -fuzztime=3s
          go test -fuzz=FuzzReplayCache -fuzztime=3s
          go test -fuzz=FuzzAntiReplayWindow -fuzztime=3s
          go test -fuzz=FuzzSlidingWindowSequence -fuzztime=3s

  release:
    name: Tag & Publish Go Module
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version & Tag
        id: semver
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Check for skip directives
          if echo "$COMMIT_MSG" | grep -iqE "\[skip release\]|\[skip tag\]|\[no-tag\]"; then
            echo "Skip directive detected in commit message. Skipping release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if HEAD is already tagged
          if git tag --points-at HEAD | grep -q "^v[0-9]"; then
            echo "HEAD is already tagged with a semantic release. Skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest tag
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
            echo "No existing tags found. Initializing release at $NEW_TAG"
          else
            echo "Latest tag: $LATEST_TAG"
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Semantic versioning calculation based on commit message
            if echo "$COMMIT_MSG" | grep -iqE "breaking change|(\w+)(\(.*\))?!:"; then
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              BUMP_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -iqE "^feat(\(.*\))?:"; then
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              BUMP_TYPE="minor"
            else
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              BUMP_TYPE="patch"
            fi

            NEW_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
            echo "Bumping $BUMP_TYPE: $LATEST_TAG -> $NEW_TAG"
          fi

          # Configure Git Author
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create Annotated Tag
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"

          # Push Tag to Origin
          git push origin "${NEW_TAG}"

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.semver.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          echo "Creating GitHub Release for $TAG..."
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes

      - name: Warm up Go Proxy & pkg.go.dev
        if: steps.semver.outputs.skipped != 'true'
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          echo "Triggering Go proxy indexation for $TAG..."

          for i in {1..8}; do
            HTTP_ROOT=$(curl -s -o /dev/null -w "%{http_code}" "https://proxy.golang.org/github.com/ihatemyfcklife/badcrypt/@v/${TAG}.info" || true)
            echo "Attempt $i: root status=$HTTP_ROOT"

            if [ "$HTTP_ROOT" = "200" ]; then
              echo "Module successfully indexed on proxy.golang.org!"
              break
            fi
            sleep 5
          done

          # Trigger documentation indexing on pkg.go.dev
          curl -s "https://pkg.go.dev/github.com/ihatemyfcklife/badcrypt@${TAG}" > /dev/null || true
          echo "Triggered pkg.go.dev documentation build."
